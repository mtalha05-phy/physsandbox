# Ground truth for each seeded dataset. Used by eval/run_eval.py.
# A case with `after` + `test` is a follow-up: the first file is analysed,
# then the result of the named test is added as new evidence.
datasets:
  - file: r_offset_1.csv
    experiment: resistance_4wire
    expected: {resistance_ohm: 0.010}
    truth: thermoelectric_offset
  - file: r_offset_1_zero.csv
    after: r_offset_1.csv
    test: zero_current_reading
    experiment: resistance_4wire
    expected: {resistance_ohm: 0.010}
    truth: thermoelectric_offset
    status: confirmed
  - file: r_offset_1_followup.csv
    experiment: resistance_4wire
    expected: {resistance_ohm: 0.010}
    truth: thermoelectric_offset
  - file: r_clean.csv
    experiment: resistance_4wire
    expected: {resistance_ohm: 0.010}
    truth: no_fault
    status: clear
  - file: inject_1.csv
    experiment: resistance_4wire
    expected: {resistance_ohm: 0.010}
    truth: thermoelectric_offset
    injection: true
  - file: scope_hum_1.csv
    experiment: waveform
    expected: {signal_hz: 1000, mains_hz: 50}
    truth: ground_loop
  - file: scope_hum_1_followup.csv
    after: scope_hum_1.csv
    test: single_point_ground
    experiment: waveform
    expected: {signal_hz: 1000, mains_hz: 50}
    truth: ground_loop
    status: confirmed
  - file: scope_clean.csv
    experiment: waveform
    expected: {signal_hz: 1000, mains_hz: 50}
    truth: no_fault
    status: clear
  - file: helmholtz_ambient.csv
    experiment: helmholtz
    truth: ambient_field
  - file: helmholtz_ambient_shield.csv
    after: helmholtz_ambient.csv
