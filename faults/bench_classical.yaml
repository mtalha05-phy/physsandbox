# Classic lab experiments: Michelson interferometer, speed of sound in a
# resonance tube, Stefan-Boltzmann law with a lamp filament. Same format as
# faults.yaml; `fix` is what to do once a cause is confirmed (PDF report).
experiments:

  michelson:
    faults:
      no_fault:
        name: No fault found
        prior: 0.30
        conditions:
          - {feature: lambda_error_sigma, op: "<", value: 4, p_true: 0.95, p_false: 0.01}
          - {feature: misfit_sigma, op: "<", value: 4, p_true: 0.95, p_false: 0.01}
        fix: Nothing to fix. Record the wavelength with its uncertainty.
      fringe_miscount:
        name: Fringes slipping past uncounted (turning too fast)
        prior: 0.20
        typical_size: "Missing one fringe in 30 makes the wavelength come out about 3% long"
        conditions:
          - {feature: lambda_error_sigma, op: ">", value: 5, p_true: 0.95, p_false: 0.02}
          - {feature: start_jump_fringes, op: abs_lt, value: 4, p_true: 0.95, p_false: 0.2}
          - {feature: recount_on_line, op: is, value: true, p_true: 0.95, p_false: 0.05}
        fix: Turn the micrometer slowly enough to count every fringe (or count with a photodiode and counter), recount the travel and refit.
      lever_scale_error:
        name: Micrometer-to-mirror lever ratio out of calibration
        prior: 0.16
        typical_size: "A lever ratio 4% off makes every wavelength 4% off, on a perfectly straight line"
        conditions:
          - {feature: lambda_error_sigma, op: ">", value: 5, p_true: 0.95, p_false: 0.02}
          - {feature: start_jump_fringes, op: abs_lt, value: 4, p_true: 0.95, p_false: 0.1}
          - {feature: misfit_sigma, op: "<", value: 4, p_true: 0.9, p_false: 0.3}
          - {feature: recount_on_line, op: is, value: true, p_true: 0.05, p_false: 0.95}
        fix: Calibrate the micrometer against a dial gauge (or a laser of known wavelength) and correct every reading by the measured ratio.
      screw_backlash:
        name: Backlash in the mirror screw (dead travel after reversing)
        prior: 0.15
        typical_size: "Winding back to the start leaves a few µm of slack: several fringes' worth of travel before the mirror moves"
        conditions:
          - {feature: start_jump_fringes, op: ">", value: 5, p_true: 0.95, p_false: 0.01}
        fix: Turn past the starting point and come back to it in the counting direction before zeroing, so the slack is already taken up, then recount.
      unknown_cause:
        name: Unknown cause (none of the above fits well)
        prior: 0.05
        conditions: []
        flat_likelihood: 0.01
        fix: Check the alignment (fringes should be concentric and centred) and the mounting of the moving mirror, then repeat.
    tests:
      slow_recount:
        name: Count the same travel again, slowly, turning one way only
        minutes: 6
        how: Turn past the start and come back to it, zero the micrometer, then count the same 300 fringes slowly, noting the reading every 20.
        adds: {feature: recount_on_line, from: recount_on_line, op: copy}
        outcomes:
          fringe_miscount: wavelength_now_right
          screw_backlash: wavelength_now_right
          lever_scale_error: still_off
          no_fault: wavelength_now_right
        safety: The laser is Class 2 or 3R. Never look into the direct beam or its reflections from the mirrors; watch the fringes on the screen, and keep watches and rings out of the beam.
      dial_gauge_check:
        name: Read the mirror's real travel with a dial gauge
        minutes: 12
        how: Clamp a 1 µm dial gauge against the moving mirror's carriage and compare it with the micrometer over the same travel.
        outcomes:
          lever_scale_error: gauge_disagrees
          screw_backlash: dead_zone_at_start
          fringe_miscount: gauge_agrees
          no_fault: gauge_agrees
        safety: Switch the laser off or block it at the source while you mount the gauge near the mirrors.

  resonance_tube:
    faults:
      no_fault:
        name: No fault found
        prior: 0.30
        conditions:
          - {feature: v_error_sigma, op: "<", value: 4, p_true: 0.95, p_false: 0.01}
          - {feature: end_correction_sigma, op: "<", value: 4, p_true: 0.95, p_false: 0.01}
        fix: Nothing to fix. Record the speed of sound with the air temperature it was measured at.
      air_temperature:
        name: Air in the tube not at the temperature entered
        prior: 0.20
        typical_size: "Air 14 °C warmer than entered makes v about 2.4% high (v = 331.3√(1 + T/273.15) m/s)"
        conditions:
          - {feature: v_error_sigma, op: ">", value: 5, p_true: 0.95, p_false: 0.02}
          - {feature: end_correction_sigma, op: "<", value: 4, p_true: 0.9, p_false: 0.2}
          - {feature: tube_air_differs, op: is, value: true, p_true: 0.95, p_false: 0.05}
        fix: Enter the temperature measured inside the tube (or let the water and air settle to room temperature) and compare with v at that temperature.
      generator_frequency:
        name: Signal generator frequency dial reading off
        prior: 0.17
        typical_size: "Analogue generator dials are often 2–5% off, which scales v by the same amount"
        conditions:
          - {feature: v_error_sigma, op: ">", value: 5, p_true: 0.95, p_false: 0.02}
          - {feature: end_correction_sigma, op: "<", value: 4, p_true: 0.9, p_false: 0.2}
          - {feature: tube_air_differs, op: is, value: true, p_true: 0.05, p_false: 0.95}
        fix: Read the frequency on a counter or oscilloscope instead of the dial, or correct every frequency by the measured ratio, then refit.
      length_zero_wrong:
        name: Lengths read from the wrong zero (not the tube's open end)
        prior: 0.15
        typical_size: "The intercept should be −0.3 × diameter (about −1 cm); a ruler zero 2.5 cm off moves it to +1.5 cm"
        conditions:
          - {feature: end_correction_sigma, op: ">", value: 5, p_true: 0.95, p_false: 0.01}
          - {feature: v_error_sigma, op: "<", value: 4, p_true: 0.9, p_false: 0.2}
        fix: Measure every length from the open end of the tube to the water surface, or subtract the ruler's offset, and refit.
      unknown_cause:
        name: Unknown cause (none of the above fits well)
        prior: 0.05
        conditions: []
        flat_likelihood: 0.01
        fix: Check that each length is the first (shortest) resonance and repeat the sweep listening for the loudest point.
    tests:
      tube_thermometer:
        name: Read the air temperature inside the tube
        minutes: 3
        how: Lower a thermometer down the tube at several depths, without touching the water, and compare with the temperature you entered.
        adds: {feature: tube_air_differs, from: tube_air_differs, op: copy}
        outcomes:
          air_temperature: temperature_differs
          generator_frequency: temperature_matches
          length_zero_wrong: temperature_matches
          no_fault: temperature_matches
        safety: If the reservoir was filled from the hot tap, the water can scald; don't put your hand in it.
      frequency_counter_check:
        name: Read the generator's frequency on a counter or oscilloscope
        minutes: 6
        how: Connect a frequency counter (or a scope) to the generator output and compare with the dial at three settings.
        outcomes:
          generator_frequency: dial_off
          air_temperature: dial_right
          length_zero_wrong: dial_right
          no_fault: dial_right
        safety: Keep the speaker volume low; tones at resonance are loud, so don't hold your ear over the tube.
      ruler_zero_check:
        name: Check where the ruler's zero sits against the tube's open end
        minutes: 1
        how: Hold a set square across the top of the tube and read the ruler there.
        outcomes:
          length_zero_wrong: zero_off
          air_temperature: zero_at_open_end
          generator_frequency: zero_at_open_end
          no_fault: zero_at_open_end

  stefan_lamp:
    faults:
      no_fault:
        name: No fault found
        prior: 0.30
        conditions:
          - {feature: exponent_shift_sigma, op: abs_lt, value: 4, p_true: 0.95, p_false: 0.01}
        fix: Nothing to fix. Record the exponent with its uncertainty and the temperature range it covers.
      ammeter_zero_offset:
        name: Ammeter zero not set (reads current with none flowing)
        prior: 0.20
        typical_size: "12 mA too much on a 0.2–0.5 A lamp makes the power high and the temperature low at the cold end; the exponent falls to about 3.8"
        conditions:
          - {feature: exponent_shift_sigma, op: "<", value: -5, p_true: 0.95, p_false: 0.02}
          - {feature: ammeter_offset_found, op: is, value: true, p_true: 0.95, p_false: 0.05}
        fix: Zero the ammeter with the circuit open (or subtract its open-circuit reading from every current) and refit.
      support_conduction:
        name: Heat lost by conduction through the filament supports
        prior: 0.17
        typical_size: "Power ∝ T⁴ plus a term ∝ (T − T₀); it matters most at the cold end and pulls the exponent below 4"
        conditions:
          - {feature: exponent_shift_sigma, op: "<", value: -5, p_true: 0.95, p_false: 0.02}
          - {feature: ammeter_offset_found, op: is, value: true, p_true: 0.05, p_false: 0.95}
        fix: Fit only the hottest points (above about 1800 K), or fit P = aT⁴ + G(T − T₀) and quote the exponent of the radiated part.
      voltage_at_supply:
        name: Voltage read at the supply, so the leads and ammeter count as lamp
        prior: 0.15
        typical_size: "1.5 Ω of leads and ammeter makes R and P too high at the cold end; the exponent rises above 4"
        conditions:
          - {feature: exponent_shift_sigma, op: ">", value: 5, p_true: 0.95, p_false: 0.01}
        fix: Connect the voltmeter directly across the lamp's terminals (four-wire) and repeat the sweep.
      unknown_cause:
        name: Unknown cause (none of the above fits well)
        prior: 0.05
        conditions: []
        flat_likelihood: 0.01
        fix: Measure the cold resistance on a four-wire meter, check the room temperature and let each point settle before reading.
    tests:
      ammeter_open_circuit:
        name: Read the ammeter with the lamp circuit open
        minutes: 2
        how: Switch the supply off, disconnect the lamp and take ten readings of the ammeter, which should read zero.
        adds: {feature: ammeter_offset_found, from: ammeter_offset_found, op: copy}
        outcomes:
          ammeter_zero_offset: reads_current
          support_conduction: reads_zero
          voltage_at_supply: reads_zero
          no_fault: reads_zero
        safety: Switch off the supply before rewiring; mains-powered bench supplies stay live inside, so keep their covers on.
      thermopile_check:
        name: Measure the radiated power directly with a thermopile
        minutes: 12
        how: Put a thermopile radiation sensor a fixed distance from the lamp and repeat the sweep; its signal is radiation only.
        outcomes:
          support_conduction: radiation_follows_T4
          ammeter_zero_offset: radiation_off_T4
          voltage_at_supply: radiation_off_T4
          no_fault: radiation_follows_T4
        safety: The bulb gets hot enough to burn; don't touch the glass, and let it cool before moving the sensor.
      voltmeter_on_lamp:
        name: Move the voltmeter leads onto the lamp's own terminals
        minutes: 2
        how: At full voltage, compare the reading at the supply with the reading across the lamp itself.
        outcomes:
          voltage_at_supply: reading_drops
          ammeter_zero_offset: reading_same
          support_conduction: reading_same
          no_fault: reading_same
        safety: The bulb gets hot enough to burn; keep your hands off the glass while the lamp is on.
