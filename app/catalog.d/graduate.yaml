# Graduate advanced-lab experiments. Merged into catalog.yaml by app/pipeline.py.
domains:
  - {id: condensed, label: "Condensed matter"}
  - {id: nuclear, label: "Nuclear & particle"}

experiments:
  nmr_echo:
    label: Pulsed NMR spin echo
    level: graduate
    domain: magnetism
    blurb: Hahn echo amplitude against echo time, to measure the spin-spin relaxation time T₂
    columns: [echo_time_ms, echo_amplitude_mV]
    model: "A(2τ) = A₀ e^(−2τ/T₂)"
    expected: [[t2_ms, "Expected T₂ (ms)", 20.0], [expected_amplitude_mV, "Echo amplitude on the reference sample (mV)", 500.0], [pulse90_us, "90° pulse length set (µs)", 10.0], [precision_mV, "Reading precision (mV)", 3.0]]
    samples:
      - [nmr_pulse_misset.csv, "Echo only half its usual size"]
      - [nmr_diffusion.csv, "Decay curves down too fast"]
      - [nmr_clean.csv, "Healthy echo decay"]
    followups: {nutation_sweep: nmr_pulse_misset_nutation.csv}
    questions: ["Fit the echo decay and report T₂", "Check the decay for an extra (2τ)³ term"]

  sc_transition:
    label: Superconducting transition
    level: graduate
    domain: condensed
    blurb: Four-probe resistance of a YBCO pellet against temperature, to find Tc and the transition width
    columns: [temperature_K, resistance_mOhm]
    model: "R(T) = R_n(T) / (1 + e^(−(T−Tc)/w))"
    expected: [[tc_K, "Expected Tc (K)", 92.0], [width_K, "Expected 10–90% width (K)", 1.0], [precision_mOhm, "Reading precision (mΩ)", 0.01]]
    samples:
      - [sc_lag.csv, "Transition low and broad"]
      - [sc_thermal_emf.csv, "Resistance never reaches zero"]
      - [sc_clean.csv, "Healthy transition"]
    followups: {warming_sweep: sc_lag_warming.csv}
    questions: ["Fit the transition and report Tc and its 10–90% width"]

  compton:
    label: Compton scattering
    level: graduate
    domain: nuclear
    blurb: Energy of Cs-137 gamma rays scattered off electrons against angle, to measure the electron's rest energy
    columns: [angle_deg, energy_keV]
    model: "E′ = E / (1 + (E/m_e c²)(1 − cos θ))"
    expected: [[source_keV, "Source line energy (keV)", 661.66], [electron_rest_energy_keV, "Accepted m_e c² (keV)", 510.999], [precision_keV, "Photopeak reading precision (keV)", 2.0]]
    samples:
      - [compton_gain.csv, "m_e c² and 662 keV both read low"]
      - [compton_backscatter.csv, "Largest-angle point off the curve"]
      - [compton_clean.csv, "Healthy measurement"]
    followups: {mca_line_calibration: compton_gain_calibration.csv}
    questions: ["Fit the Compton formula and report m_e c²"]

  optical_pumping:
    label: Optical pumping of rubidium
    level: graduate
    domain: quantum
    blurb: Zeeman resonance frequency of ⁸⁵Rb and ⁸⁷Rb against coil current, to measure the Landé g_F factors
    columns: [coil_current_A, frequency_kHz, isotope]
    model: "hf = g_F μ_B |k·I + B₀|"
    expected: [[coil_constant_uT_per_A, "Sweep coil constant k (µT/A)", 60.0], [precision_kHz, "Resonance reading precision (kHz)", 1.0]]
    samples:
      - [rb_current_scale.csv, "Both g_F values 7% low"]
      - [rb_residual_field.csv, "Resonance not at zero frequency at zero current"]
      - [rb_clean.csv, "Healthy measurement"]
    followups: {reference_ammeter_series: rb_current_scale_refmeter.csv}
    questions: ["Fit both isotopes and report g_F and the residual field"]

sample_info:
  nmr_clean.csv: ["Hahn spin echoes (90°–τ–180°) in copper-sulphate-doped water, 2τ from 2 to 58 ms.", "Nothing should look off: a single exponential with T₂ = 20 ms and a 500 mV echo."]
  nmr_pulse_misset.csv: ["The same doped-water sample and the same echo sequence.", "The decay has the right T₂, but the echo starts at about 290 mV instead of 500 mV."]
  nmr_diffusion.csv: ["The same doped-water sample and the same echo sequence.", "The echo starts at the right size, but the decay bends downward and drops much faster than T₂ = 20 ms at long echo times."]
  nmr_pulse_misset_nutation.csv: ["A nutation sweep on the same sample: FID amplitude after one pulse, pulse length 2 to 34 µs.", "Is the first maximum at the 10 µs set as the 90° pulse?"]
  sc_clean.csv: ["Four-probe resistance of a YBCO pellet at 100 mA, logged while cooling from 110 K to 80 K.", "Nothing should look off: a sharp drop to zero at 92 K."]
  sc_lag.csv: ["The same pellet, current and cooling sweep.", "The resistance drops to zero, but about 1.5 K low and spread over more than 2 K."]
  sc_thermal_emf.csv: ["The same pellet, current and cooling sweep.", "The transition is sharp and at 92 K, but below it the resistance stays at about 0.06 mΩ instead of zero."]
  sc_lag_warming.csv: ["The same cooling sweep followed by a warming sweep at the same rate.", "Do the two sweeps put the transition at the same temperature?"]
  compton_clean.csv: ["Photopeak energy of Cs-137 gammas scattered off an aluminium rod into a NaI(Tl) detector, 15° to 135°.", "Nothing should look off: the Compton formula fits with m_e c² = 511 keV."]
  compton_gain.csv: ["The same source, scatterer and detector.", "The points follow a Compton-like curve, but the fit puts the unscattered line near 629 keV and m_e c² about 5% low."]
  compton_backscatter.csv: ["The same source, scatterer and detector.", "Seven angles fit the Compton formula, but the 135° point sits about 20 keV below the curve."]
  compton_gain_calibration.csv: ["Four known lines (Am-241, Na-22 and Cs-137) read with the same MCA settings, true against measured.", "Do the lines read at their true energies?"]
  rb_clean.csv: ["Zeeman resonance of ⁸⁷Rb and ⁸⁵Rb in a lamp-pumped cell, sweep-coil current 0.1–1.0 A, horizontal field nulled.", "Nothing should look off: g_F = 1/2 and 1/3, lines through zero."]
  rb_current_scale.csv: ["The same cell and coils.", "Both isotopes give straight lines through zero with the right 3:2 ratio, but both g_F values come out about 7% low."]
  rb_residual_field.csv: ["The same cell and coils.", "The slopes give the right g_F values, but neither line passes through zero frequency at zero current."]
  rb_current_scale_refmeter.csv: ["The sweep coil set to 0.5 A on the lab reading: ten readings on the lab meter, then ten on a calibrated ammeter in series.", "Do the two meters agree?"]

