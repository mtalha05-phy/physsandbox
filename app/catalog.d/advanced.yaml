  average_over_peak: ["Average ÷ field at the probe", "", 1]
  coercivity_A_per_m: ["Coercivity H_c", "A/m", 1]
  expected_coercivity_A_per_m: ["Expected H_c", "A/m", 1]
  remanence_T: ["Remanence B_r", "T", 1]
