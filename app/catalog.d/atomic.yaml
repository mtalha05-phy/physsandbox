  d_outer_nm: ["Outer ring spacing", "nm", 1]
  accepted_d_inner_nm: ["Inner spacing, graphite", "nm", 1]
  accepted_d_outer_nm: ["Outer spacing, graphite", "nm", 1]
  spacing_ratio: ["Ratio of the spacings", "", 1]
  accepted_spacing_ratio: ["Ratio, graphite (√3)", "", 1]
  wavelength_at_highest_kV_pm: ["de Broglie λ at the highest voltage", "pm", 1]
  camera_length_measured_mm: ["Foil-to-screen distance, measured", "mm", 1]
  camera_length_entered_mm: ["Foil-to-screen distance, used", "mm", 1]
  splitting_per_tesla_per_m: ["Splitting per tesla", "/m/T", 1]
  expected_splitting_per_tesla_per_m: ["Expected splitting per tesla", "/m/T", 1]
  bohr_magneton_JT: ["Bohr magneton, fitted", "J/T", 1]
  accepted_bohr_magneton_JT: ["Bohr magneton, accepted", "J/T", 1]
  e_over_m_C_per_kg: ["e/m from μ_B", "C/kg", 1]
  lab_over_reference_field: ["Lab ÷ calibrated field", "", 1]
  elementary_charge_C: ["Charge unit e, fitted", "C", 1]
  accepted_elementary_charge_C: ["e, accepted", "C", 1]
  quantisation_chi2_per_dof: ["Fit to whole steps (χ²/dof)", "", 1]
  largest_multiple_n: ["Largest n among the drops", "", 1]
  plate_spacing_measured_mm: ["Plate spacing, measured", "mm", 1]
  plate_spacing_used_mm: ["Plate spacing, used", "mm", 1]
  charge_correction_factor: ["Charge correction (measured ÷ used)", "", 1]
